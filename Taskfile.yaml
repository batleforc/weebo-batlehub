version: "3"

includes:
  mise: ./.tasks/mise.yaml
  # cog.toml, rendered from weebo-operator-kit's template (task kit:cog),
  # and the pins on the kit (task kit:sync).
  kit: ./.tasks/kit.yaml
  # BatleHub admin API client (spec/).
  gen: ./.tasks/gen.yaml
  e2e: ./.tasks/e2e.yaml
  # A disposable BatleHub for the live tests.
  batlehub: ./.tasks/batlehub.yaml
  # The kit's shared tasks, pinned to the kit tag of Cargo.toml and to
  # their sha256: `task kit:sync` rewrites both. `task --offline` runs from
  # Task's cache.
  rust:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.23.1/tasks/rust.yaml
    checksum: 75360142235715643265ae41de1f531dda6562a2472e8d9af21ad65f7d753d63
    vars:
      # The generated batlehub-client and the test harnesses themselves.
      COVERAGE_IGNORE: '(batlehub-client|testkit|test_support|/tests/)'
      # Live-test credentials (`task batlehub:container:start`).
      COVERAGE_ENV_FILE: .batlehub-test.env
      COVERAGE_REQUIRE_ENV: BATLEHUB_URL
  repo:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.23.1/tasks/repo.yaml
    checksum: 162d15bf9c41f494efcb6d73e089ac685d23bc98269a41daf62db26534f52f72
    vars:
      CONTAINERFILES: Containerfile Containerfile.static
      NPM_DIR: docs
  helm:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.23.1/tasks/helm.yaml
    checksum: 8f42df9a351bfeea80dde2d94bfb809d1e8c32489c7c5c232fcf60175eb6e094
    vars:
      CHART: deploy/charts/weebo-batlehub

# `crates/testkit` builds the `envtest` crate, whose bindgen step needs a
# real libclang.so and the C headers. Defaults match Fedora's clang-libs +
# gcc; an exported value wins, even an empty one (CI on Ubuntu sets
# BINDGEN_EXTRA_CLANG_ARGS="" — libclang-dev finds its own headers there).
env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  init:
    desc: "Install the toolchain (mise), lock its versions (mise.lock, the first time), render cog.toml from the kit and install the git hooks"
    cmds:
      - task mise:install
      # mise.toml asks for `latest`: the lock is what makes CI and every
      # checkout install the same tools (audit ones included).
      - test -f mise.lock || task mise:lock:gen
      - task: kit:cog

  doctor:
    desc: "Check the local dev setup needed by envtest (Go, libclang, control-plane binaries), the chart tools and the git hooks"
    cmds:
      - task: rust:doctor
        vars: { DOCTOR_TOOLS: "helm hadolint cargo-llvm-cov" }

  recu:
    desc: "Regenerate every committed artifact: the BatleHub client (offline, from the vendored spec), the CRDs, their copies in the chart and the docs' generated pages"
    cmds:
      - task: gen:client
      - mise exec -- cargo run -q -p crdgen -- --out deploy/crd/
      # The chart ships the CRDs as templates (Helm never upgrades crds/),
      # under `crds.install` + `helm.sh/resource-policy: keep`.
      - task: helm:crds
      # CRD reference pages + form schemas of the docs site, and its operator
      # reference (reason codes and metrics read from crates/): weebo-crd-docs
      # (@weebo/operator-docs) reads docs/crd-docs.config.mjs and clears its
      # own previous outputs.
      - task: docs:deps
      - mise exec -- npm run gen:crds --prefix docs --silent

  docs:deps:
    desc: "Install the docs site's npm dependencies (from the lockfile) when missing"
    status:
      - test -d docs/node_modules
    cmds:
      - mise exec -- npm ci --prefix docs --no-fund

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run dev

  docs:build:
    desc: "Production build + lint of the documentation site"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run lint
      - mise exec -- npm run build

  lint:
    desc: "cargo fmt --check + clippy -D warnings, actionlint on CI, hadolint on the Containerfiles"
    cmds:
      - task: rust:lint
      - task: repo:lint

  lint:helm:
    desc: "helm lint + smoke renders of the operator chart (the kit's value combinations), then where this chart's RBAC lands in each watch mode"
    vars:
      T: mise exec -- helm template smoke deploy/charts/weebo-batlehub --set crds.install=false
      # One document of a render (stdin): kind $1 named $2.
      DOC: >-
        doc() { awk -v k="$1" -v n="$2" 'BEGIN{RS="\n---\n"} $0 ~ ("\nkind: " k "\n") && $0 ~ ("\n  name: " n "\n")'; }
    cmds:
      - task: helm:lint
      # Renders go into a variable first (no pipefail in Task's shell).
      # Cluster-wide: the managed instances' rules and the TokenReview
      # binding in the ClusterRole, no watch Role.
      - >-
        {{.DOC}}; out="$({{.T}})"
        && cr="$(printf '%s\n' "$out" | doc ClusterRole smoke-weebo-batlehub)"
        && printf '%s\n' "$cr" | grep -q '  - deployments'
        && printf '%s\n' "$cr" | grep -q '  - clusterrolebindings'
        && printf '%s\n' "$out" | grep -q 'name: WEEBO_BATLEHUB_TOKENREVIEW_CLUSTERROLE'
        && test -z "$(printf '%s\n' "$out" | doc Role smoke-weebo-batlehub-watch)"
      # One namespace: the namespaced rules only in its watch Role, nothing
      # of them (nor Namespaces, nor TokenReview) left in the ClusterRole.
      - >-
        {{.DOC}}; out="$({{.T}} --set watch.namespace=team-a)"
        && role="$(printf '%s\n' "$out" | doc Role smoke-weebo-batlehub-watch)"
        && printf '%s\n' "$role" | grep -q 'namespace: team-a'
        && for r in configmaps pods replicasets deployments services persistentvolumeclaims
        poddisruptionbudgets networkpolicies horizontalpodautoscalers batlehubmaintenances;
        do printf '%s\n' "$role" | grep -q "  - $r\$" || { echo "watch Role lacks $r" >&2; exit 1; }; done
        && cr="$(printf '%s\n' "$out" | doc ClusterRole smoke-weebo-batlehub)"
        && test -n "$cr"
        && if printf '%s\n' "$cr" | grep -qE '  - (deployments|configmaps|namespaces|clusterrolebindings)$'; then exit 1; fi
        && if printf '%s\n' "$out" | grep -q 'WEEBO_BATLEHUB_TOKENREVIEW_CLUSTERROLE'; then exit 1; fi
      # Fully namespaced: no ClusterRole, the managed instances' rules still
      # in the watch Role (managed mode works there).
      - >-
        {{.DOC}}; out="$({{.T}} --set watch.namespace=team-a --set watch.clusterKinds=false)"
        && printf '%s\n' "$out" | doc Role smoke-weebo-batlehub-watch | grep -q '  - deployments$'
        && if printf '%s\n' "$out" | grep -qE '^kind: ClusterRole(Binding)?$'; then exit 1; fi

  test:
    desc: "Every test that needs no cluster, as the kit's: unit, contract (the admin gateway against wiremock, the CLI, the committed CRDs) and doctests"
    cmds:
      # --no-fail-fast: one failing crate must not hide the others' results.
      # The test targets under crates/*/tests that run without envtest;
      # the others are test:integration's.
      - >-
        mise exec -- cargo test --workspace --lib --bins --no-fail-fast
        --test admin_gateway_contract --test in_sync --test cli
      # Doctests can't be mixed with other targets.
      - mise exec -- cargo test --workspace --doc --no-fail-fast

  test:integration:
    desc: "Every test target, including the envtest integration tests under crates/*/tests"
    cmds:
      - mise exec -- cargo test --workspace --tests --no-fail-fast

  test:all:
    desc: "Every test suite: unit/contract + integration"
    cmds:
      - task: test
      - task: test:integration

  test:live-batlehub:
    desc: >
      Tests against a real BatleHub (ignored by default): the HTTP gateway,
      then the controllers end to end on envtest. Needs BATLEHUB_URL,
      BATLEHUB_ADMIN_TOKEN and BATLEHUB_USER_TOKEN — exported, or read from
      .batlehub-test.env (`task batlehub:container:start`).
    dotenv: [.batlehub-test.env]
    cmds:
      - |
        for name in BATLEHUB_URL BATLEHUB_ADMIN_TOKEN BATLEHUB_USER_TOKEN; do
          if [ -z "$(printenv "$name")" ]; then
            echo "$name is not set: run 'task batlehub:container:start' first" >&2
            exit 1
          fi
        done
      - mise exec -- cargo test -p adapters-outbound --test live_batlehub -- --ignored
      - mise exec -- cargo test -p adapters-inbound --test live_batlehub -- --ignored
      - mise exec -- cargo test -p importer --test live_batlehub -- --ignored

  perf:
    desc: >
      What the operator costs a cluster (weebo-kit-perf): the release binary
      against envtest and a fake BatleHub — idle, a burst of
      BatleHubPackageGrants, churn, delete — checked against the
      small-cluster budget; report in target/perf/. PERF_OBJECTS,
      PERF_IDLE_SECS; WEEBO_PERF_BASELINE=<previous json>;
      WEEBO_PERF_REPORT_ONLY=1 to report without failing.
    cmds:
      - mise exec -- cargo test --release -p operator --test perf -- --ignored --nocapture

  coverage:
    desc: "Line coverage of every test layer, live tests against a real BatleHub included (cargo llvm-cov), failing under 85%; writes target/lcov.info"
    cmds:
      - task: rust:coverage

  audit:
    desc: "Check dependencies and the Containerfiles for CVE (cargo-deny + trivy, npm audit on the docs site, trivy config)"
    cmds:
      - task: rust:audit
      - task: repo:audit
