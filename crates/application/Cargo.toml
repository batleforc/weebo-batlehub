[package]
name = "application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain = { workspace = true }
api = { workspace = true }
weebo-kit-application = { workspace = true }
async-trait = { workspace = true }
jiff = { workspace = true }
# The types of the objects a managed instance owns (no client).
k8s-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# A maintenance run is bounded by its `timeoutSeconds`.
tokio = { workspace = true }

[dev-dependencies]
kube = { workspace = true }
tokio = { workspace = true }
# The kit's in-memory owned objects, under `FakeWorkloads`.
weebo-kit-application = { workspace = true, features = ["test-support"] }

[features]
# Exposes `test_support` (in-memory gateway) to other crates' tests.
test-support = ["weebo-kit-application/test-support"]
