# Copied over crates/batlehub-client/Cargo.toml by spec/scripts/gen-client.sh:
# the generator's own manifest pins native-tls and edition 2021, this one
# routes every dependency through the workspace (rustls only).
[package]
name = "batlehub-client"
description = "BatleHub admin API client generated by openapi-generator from the vendored OpenAPI spec (spec/)"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
# Generated doc comments are copied verbatim from the spec and are not
# valid rustdoc tests.
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_with = { version = "3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_repr = "0.1"
url = "2.5"
uuid = { workspace = true, features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { workspace = true, features = ["json", "multipart", "query", "form"] }
