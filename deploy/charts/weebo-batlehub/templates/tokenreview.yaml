{{- /*
What a managed BatleHubLocalInstance with a `kubernetes` auth provider is
bound to (managed.serviceAccount.autoTokenReview): TokenReview create,
nothing else. The operator binds it through one ClusterRoleBinding of the
same name, whose subjects it edits (verb `bind` on this ClusterRole only),
and never writes a ClusterRole itself. tokenReview.enabled and
cluster-wide only: otherwise the operator binds nothing
(TokenReviewUnavailable).
*/ -}}
{{- if include "operator.tokenReview" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-operator.fullname" . }}-tokenreview
  labels:
    {{- include "weebo-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
{{- end }}
