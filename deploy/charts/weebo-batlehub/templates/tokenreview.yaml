{{- /*
What a managed BatleHubLocalInstance with a `kubernetes` auth provider is
bound to (managed.serviceAccount.autoTokenReview): TokenReview create,
nothing else. The operator binds it (verb `bind` on this ClusterRole only)
and never writes a ClusterRole itself. Cluster-wide only: limited to one
namespace, the operator binds nothing (TokenReviewUnavailable).
*/ -}}
{{- if and (include "weebo-operator.watchClusterKinds" .) (not (include "weebo-operator.watchNamespace" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-operator.fullname" . }}-tokenreview
  labels:
    {{- include "weebo-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
{{- end }}
