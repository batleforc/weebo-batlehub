apiVersion: v2
name: weebo-batlehub
description: Kubernetes operator driving BatleHub (package registry proxy-cache) instances as CRDs.
type: application
version: 0.3.1
appVersion: "0.3.1"
# Native `preStop: sleep` and the admission/policy APIs used here.
kubeVersion: ">=1.30.0-0"
home: https://github.com/batleforc/weebo-batlehub
sources:
  - https://github.com/batleforc/weebo-batlehub
keywords:
  - batlehub
  - operator
  - kubernetes-operator
  - crd
maintainers:
  - name: batleforc
    url: https://github.com/batleforc
dependencies:
  # Every resource but the CRDs (templates/operator.yaml); its version is
  # the kit's, as in Cargo.toml (`task kit:sync` keeps them in step).
  - name: weebo-operator-lib
    version: 0.21.0
    repository: oci://ghcr.io/batleforc/charts
