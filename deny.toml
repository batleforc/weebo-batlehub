# cargo-deny — supply-chain gate run by `task audit` and CI.
#   advisories — RUSTSEC vulnerabilities, unmaintained and yanked crates
#   licenses   — flag a copyleft transitive dependency
#   sources    — only crates.io, plus the shared weebo-operator-kit and
#                BatleHub (its configuration parser)

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# BatleHub's configuration parser (`batlehub-config`) comes with
# `batlehub-core`'s dependencies, under licenses BatleHub's own deny.toml
# allows. Each one is an exception here rather than a global allow: a new
# crate under them still stops the audit.
# MPL-2.0 (file-level copyleft, compatible with Apache-2.0 when unmodified):
# the HTML sanitizer's CSS parser (ammonia → cssparser → dtoa-short).
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

# Permissive (BSD-like) and public domain: the archive reader (zip).
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
crate = "ppmd-rust"
allow = ["CC0-1.0"]

# Weak-copyleft, but only a build tool of the test-only `envtest` harness
# (rust2go → cbindgen); it never ends up in the operator binary.
[[licenses.exceptions]]
crate = "cbindgen"
allow = ["MPL-2.0"]

[bans]
# Duplicates (base64, thiserror, darling, ... pulled at two majors by the
# ecosystem) are reported so they get noticed, but do not fail the check.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The shared operator kit and BatleHub's configuration parser, both
# pinned by tag in Cargo.toml.
allow-git = [
    "https://github.com/batleforc/weebo-operator-kit",
    "https://github.com/batleforc/batlehub",
]
