name: CI

# GitHub Actions syntax kept compatible with Forgejo Actions: no marketplace
# action without a Forgejo equivalent, every tool comes from mise.toml.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # weebo-operator-kit's checks: task lint, test:all, audit, lint:helm.
  checks:
    uses: batleforc/weebo-operator-kit/.github/workflows/checks.yml@v0.22.0
    permissions:
      contents: read
    with:
      test-task: "test:all"
      helm-task: "lint:helm"

  regen-and-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: mise install
      # The BatleHub client (offline, from the vendored spec), the CRDs, their
      # chart copies and the docs' generated pages are committed and must
      # never drift from their source.
      - run: mise exec -- task recu --force
      - name: Fail if committed generated files are stale
        run: |
          git diff --exit-code crates/batlehub-client/ deploy/ docs/content/docs/crds/ \
            docs/public/crd-schemas/ docs/content/docs/reference/
          # A generated file that's new must be committed too.
          test -z "$(git status --porcelain crates/batlehub-client/ deploy/ docs/content/docs/crds/ docs/public/crd-schemas/ docs/content/docs/reference/)"

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: mise install node task
      - run: mise exec -- task docs:build

  image-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        file: [Containerfile, Containerfile.static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Build-only proof that both images build; publishing is publish.yml's
      # job.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: weebo-batlehub-operator:ci
      # The image runs, not just builds (glibc ABI of each base).
      - run: docker run --rm --entrypoint /usr/local/bin/operator weebo-batlehub-operator:ci --version
      - run: docker run --rm --entrypoint /usr/local/bin/weebo-batlehub-importer weebo-batlehub-operator:ci --version
